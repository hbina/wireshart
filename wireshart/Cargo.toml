[package]
name = "wireshart-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
pcap-parser-lib = { path = "../pcap-parser" }
clap = { version = "4.0", features = ["derive"] }
memmap2 = "0.9.5"
etherparse = "0.16.0"
async-trait = "0.1.83"
once_cell = "1.21.0"

[[bin]]
name = "wireshart"
path = "src/main.rs"
